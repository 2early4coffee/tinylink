services:
  redis:
    image: redis:7-alpine
    container_name: tiny-link-redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: tiny-link-backend
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TINYLINK_BASE_URL: http://localhost:4200
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tiny-link-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    restart: unless-stopped
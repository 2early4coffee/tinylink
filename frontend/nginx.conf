server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Forward API calls to the Spring Boot container
    location ^~ /api/ {
        proxy_pass http://backend:8080;

        # The backend sets the same security headers. Hide its copies so each header appears once.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Never cache index.html, so new deploys load straight away
    location = /index.html {
        expires -1;
    }

    # Angular adds hashes to built file names, so these can be cached for a year
    location ~* \.(?:js|css|woff2?|ico|png|jpe?g|gif|svg|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Any other URL falls back to the Angular app, so refreshing a route works
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Copy to env.yaml (which is git-ignored) and fill in your own values.
# Quote every value. Do not commit env.yaml, it holds your database password.

# From your Postgres provider (for Neon: use the direct host, not the "-pooler" one)
DB_URL: "jdbc:postgresql://YOUR-HOST/YOUR-DB?sslmode=require"
DB_USER: "your-db-user"
DB_PASSWORD: "your-db-password"

# The public URL of the service, no trailing slash. Known after the first deploy.
TINYLINK_BASE_URL: "https://REPLACE-ME.run.app"

# Google appends the real visitor address to X-Forwarded-For
TINYLINK_CLIENT_IP_PROXY_HOPS: "1"

TINYLINK_STATS_TIMEZONE: "Africa/Nairobi"
LOG_LEVEL: "INFO"
